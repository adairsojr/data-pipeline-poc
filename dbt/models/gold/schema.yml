version: 2

# =====================================================================
# TESTES DA CAMADA GOLD
# =====================================================================
# Protegem o MODELO DIMENSIONAL:
# - unique/not_null nas surrogate keys da dimensão e no grão da fato;
# - relationships entre a fato e a dimensão (a "chave estrangeira" que o
#   Delta/Parquet não tem, virando teste).
# =====================================================================

models:
  - name: fato_taxa
    description: >
      Fato no grão de UM município (2023). Contém a FK uf_sk, dimensões
      degeneradas (código/nome do município, ano), as taxas de origem e a
      métrica derivada abandono_combinado.
    columns:
      - name: codigo_municipio
        description: Código IBGE do município (dimensão degenerada).
        tests:
          - not_null
          - unique        # garante o GRÃO da fato
      - name: uf_sk
        description: FK para dim_uf.
        tests:
          # INTEGRIDADE REFERENCIAL sem FK: todo uf_sk da fato tem de
          # existir em dim_uf. É este teste que "fecha" o tratamento do
          # DEFEITO 3 (UF órfã 'ZZ').
          - not_null
          - relationships:
              arguments:
                to: ref('dim_uf')
                field: uf_sk

  - name: dim_uf
    description: Dimensão de UF -> região.
    columns:
      - name: uf_sk
        tests:
          - not_null
          - unique
      - name: uf
        tests:
          - unique
      - name: regiao
        tests:
          - accepted_values:
              arguments:
                values: ["Norte", "Nordeste", "Sudeste", "Sul", "Centro-Oeste"]
