version: 2

# =====================================================================
# TESTES DA CAMADA GOLD
# =====================================================================
# Aqui aparece o teste mais interessante do projeto: `relationships`.
#
# Em um banco relacional, a integridade entre fato e dimensão seria
# garantida por uma CHAVE ESTRANGEIRA — o banco IMPEDIRIA a gravação
# inválida. Em arquivos Parquet não existe FK.
#
# A integridade vira então uma VERIFICAÇÃO: o teste procura órfãos
# (registros do fato apontando para dimensão inexistente).
#
# ⚠ A palavra importa: a FK IMPEDIA; o teste apenas DETECTA.
# É a Era 2 da aula anterior — o lake ganhou flexibilidade e perdeu
# garantias nativas.
# =====================================================================

models:
  - name: fato_chamado
    description: >
      Tabela fato no grão de chamado (uma linha = um chamado).
      Contém a medida tempo_atendimento_dias e as chaves para as
      dimensões unidade, categoria e tempo.
    columns:
      - name: chamado_id
        description: >
          Identificador de negócio do chamado (dimensão degenerada).
          É também a identidade da linha: a fato NÃO tem surrogate key
          própria, porque o grão é um chamado por linha e esta coluna
          já é única e legível.
        tests:
          - not_null
          - unique     # garante o GRÃO: um chamado não pode repetir
      - name: unidade_sk
        description: Chave para dim_unidade.
        tests:
          # o "FK que não existe": procura chamados apontando para
          # unidade inexistente. Passa porque o modelo já filtra —
          # mas o teste continua vigiando cargas futuras.
          #
          # Repare que agora ele confere HASH contra HASH: prova que a
          # SK calculada na fato bate com a SK calculada na dimensão.
          - relationships:
              arguments:
                to: ref('dim_unidade')
                field: unidade_sk
      - name: categoria_sk
        description: Chave para dim_categoria.
        tests:
          - relationships:
              arguments:
                to: ref('dim_categoria')
                field: categoria_sk
      - name: data_abertura_sk
        description: Papel "abertura" da dim_tempo (smart key AAAAMMDD).
        tests:
          # ROLE-PLAYING testado: cada papel tem seu próprio teste
          # contra a MESMA dimensão de calendário.
          - relationships:
              arguments:
                to: ref('dim_tempo')
                field: data_sk
      - name: data_fechamento_sk
        description: >
          Papel "fechamento" da dim_tempo. NULA para chamado em
          andamento — o teste relationships ignora nulos, então só
          confere as datas que existem.
        tests:
          - relationships:
              arguments:
                to: ref('dim_tempo')
                field: data_sk

  - name: dim_unidade
    description: Dimensão conformada de unidade de atendimento.
    columns:
      - name: unidade_sk
        description: Surrogate key (hash da chave de negócio).
        tests:
          - not_null
          - unique     # dimensão com chave duplicada causaria fan-out
      - name: unidade_id
        description: Chave de negócio (vinda da origem).
        tests:
          - not_null
          - unique     # 1 versão por unidade (sem SCD2, id também é único)

  - name: dim_categoria
    description: Dimensão conformada de categoria de chamado.
    columns:
      - name: categoria_sk
        tests:
          - not_null
          - unique
      - name: categoria_id
        tests:
          - not_null
          - unique

  - name: dim_tempo
    description: Dimensão de calendário, gerada pelo pipeline.
    columns:
      - name: data_sk
        description: Smart key AAAAMMDD (a exceção aceita pelo Kimball).
        tests:
          - not_null
          - unique
      - name: data
        tests:
          - not_null
          - unique
