version: 2

# source() = dados que ENTRAM no domínio do dbt (produzidos pela ingestão Python).
# ref()    = dependência entre modelos produzidos PELO PRÓPRIO dbt.
# É com source() e ref() que o dbt descobre a DAG do projeto.
#
# O Bronze aqui é DELTA LAKE (não Parquet solto). Cada tabela Delta é
# lida pelo DuckDB via delta_scan() — ver os modelos stg_*. O
# external_location abaixo documenta ONDE cada tabela mora; a leitura
# em si é feita com delta_scan no SQL do staging, porque o formato Delta
# exige a função dedicada (o glob de Parquet leria os arquivos de TODAS
# as versões de uma vez, ignorando o log de transações).
sources:
  - name: bronze
    description: >
      Camada Bronze (PRESERVAÇÃO DO BRUTO): tabelas Delta Lake gravadas
      pela ingestão (Python + Pandas + deltalake), preservando os dados
      próximos à origem, COM os defeitos. Cada execução do pipeline gera
      uma nova VERSÃO da tabela Delta (time travel).
    tables:
      - name: taxas
        description: Taxas de rendimento por município do INEP (CSV), capturadas em Delta.
      - name: ufs
        description: Cadastro de UF -> região capturado do JSON de origem (Delta).
