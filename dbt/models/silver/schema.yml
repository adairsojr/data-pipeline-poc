version: 2

# =====================================================================
# TESTES DA CAMADA SILVER
# =====================================================================
# Qualidade de dados COMO CÓDIGO: cada teste vira uma consulta que
# procura linhas que violam a regra. Se alguma aparece, o teste falha.
# Rode com `dbt test` (ou `dbt build`, que faz run + test).
# =====================================================================

models:
  - name: stg_taxas
    description: >
      Taxas de rendimento por município (INEP 2023), limpas, tipadas e
      padronizadas. Uma linha por município. Duplicatas removidas,
      vírgula decimal corrigida, UF padronizada, registros sem código
      descartados.
    columns:
      - name: codigo_municipio
        description: Código IBGE do município (chave de negócio).
        tests:
          - not_null      # DEFEITO 5 tratado: sem código não passa
          - unique        # garante o GRÃO: um município por linha (dedup ok)
      - name: ano
        description: Ano do Censo Escolar.
        tests:
          - not_null
      - name: uf
        description: Sigla da UF, padronizada (maiúscula, sem espaços).
        tests:
          - not_null

  - name: stg_ufs
    description: Cadastro de UF -> região, deduplicado por sigla.
    columns:
      - name: uf
        description: Sigla da UF.
        tests:
          - not_null
          - unique        # DEFEITO 7 tratado: uma UF por linha
      - name: regiao
        description: Macrorregião do IBGE.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Norte", "Nordeste", "Sudeste", "Sul", "Centro-Oeste"]
