# Em projetos reais, o profiles.yml costuma ficar FORA do repositório (~/.dbt/),
# porque carrega credenciais de banco. Aqui não há credencial nenhuma —
# o "banco" é um arquivo DuckDB local — então versionamos para simplificar a aula.
central_servicos:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: ../data/analytics.duckdb
      threads: 1
      # Extensão que permite ao DuckDB LER as tabelas Delta do Bronze
      # (delta_scan). É baixada automaticamente no primeiro uso.
      extensions:
        - delta
